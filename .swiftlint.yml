# SwiftLint config for Vacuum PCB.
#
# Hobby project, single author. The defaults skew toward enterprise codebases
# (file_length 400, function_body_length 40) — values raised so the existing
# code passes without churn. Tighten later if a file is genuinely too long.

included:
  - Vacuum PCB/Vacuum PCB

excluded:
  - Vacuum PCB/Vacuum PCB/Examples/inverter.vpcb
  - .build
  - DerivedData

# Off by default
disabled_rules:
  - trailing_comma            # Swift idiom is comma-tolerant; Xcode autoformat adds them.
  - todo                      # We have TODO/FIXME notes intentionally.
  - identifier_name           # Single-letter math vars (x, y, r, c, s) are everywhere.
  - large_tuple               # Pin descriptors / placement tuples use 4-tuples.
  - type_body_length          # The CAD pipeline is one big enum; let it be big.

# Soft thresholds — warn long, never fail.
line_length:
  warning: 130
  error: 500
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 1200
  error: 2000

function_body_length:
  warning: 100
  error: 200

cyclomatic_complexity:
  warning: 20
  error: 40

type_name:
  min_length: 2
  max_length: 60
  # Xcode's @main App template is Vacuum_PCBApp (underscore-suffixed
  # because the project name contains a space).
  excluded:
    - Vacuum_PCBApp

nesting:
  type_level: 3
